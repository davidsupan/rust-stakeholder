[package]
name = "rust-stakeholder"
version = "0.1.0"
edition = "2021"

[dependencies]
aes-gcm-siv = "0.11"
base64 = "0.22"
clap = { version = "4.5.32", features = ["derive"] }
colored = "3.0.0"
console = "0.15.11"
ctrlc = "3.4.5"
indicatif = "0.17.11"
rand = "0.9.0"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
